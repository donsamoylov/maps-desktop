<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Open in Maps Desktop</title>
<style>
  :root { color-scheme: light dark; --line: color-mix(in srgb, CanvasText 14%, transparent); }
  body { font: 15px/1.55 -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; padding: 48px 20px;
         background: Canvas; color: CanvasText; }
  main { max-width: 560px; margin: 0 auto; }
  header { text-align: center; margin-bottom: 32px; }
  h1 { font-size: 26px; font-weight: 600; margin: 12px 0 6px; }
  .lead { color: GrayText; margin: 0; }
  section { border-top: 1px solid var(--line); padding: 22px 0 22px 44px; position: relative; }
  h2 { font-size: 17px; font-weight: 600; margin: 0 0 6px; }
  .n { position: absolute; left: 0; top: 21px; width: 28px; height: 28px; border-radius: 50%;
       background: #1a73e8; color: #fff; font-weight: 600; display: grid; place-items: center; }
  p { margin: 0 0 12px; }
  .small { color: GrayText; font-size: 13px; }
  a { color: #1a73e8; }
  .button { display: inline-block; font: inherit; font-weight: 500; padding: 8px 18px; border-radius: 8px;
            cursor: pointer; border: 1px solid #1a73e8; background: #1a73e8; color: #fff; text-decoration: none; }
  #status { margin: 12px 0 0; font-weight: 500; }
  #status.ok { color: #188038; }
  #status.bad { color: #d93025; }
  @media (prefers-color-scheme: dark) { #status.ok { color: #81c995; } #status.bad { color: #f28b82; } }
  ul { margin: 0; padding-left: 18px; }
  li { margin-bottom: 8px; }
  .notice { margin: 20px 0 0; padding: 14px 16px; border-radius: 10px; text-align: left;
            background: color-mix(in srgb, #f9ab00 16%, transparent); }
  footer { border-top: 1px solid var(--line); padding-top: 18px; text-align: center; font-size: 13px; }
</style>
</head>
<body>
<main>
  <header>
    <img src="icons/128.png" width="80" height="80" alt="">
    <h1 data-msg="welTitle"></h1>
    <p class="lead" data-msg="welLead"></p>
    <p id="notMac" class="notice" hidden data-msg="notMac"></p>
  </header>

  <section class="step">
    <span class="n">1</span>
    <h2 data-msg="welStep1"></h2>
    <p data-msg="welStep1Text"></p>
    <a class="button" data-href="download" data-msg="download"></a>
    <p class="small" style="margin-top: 12px"><span data-msg="installHow"></span>
      <a data-href="installHelp" target="_blank" data-msg="more"></a></p>
  </section>

  <section class="step">
    <span class="n">2</span>
    <h2 data-msg="welStep2"></h2>
    <p data-msg="welStep2Text"></p>
    <button id="connect" class="button" data-msg="connect"></button>
    <p id="status" hidden></p>
  </section>

  <section class="step">
    <span class="n">3</span>
    <h2 data-msg="welStep3"></h2>
    <ul>
      <li><span data-msg="howClick"></span> <a id="try" href="https://www.google.com/maps/search/Eiffel+Tower" target="_blank" data-msg="tryIt"></a></li>
      <li data-msg="howTab"></li>
      <li data-msg="howPause"></li>
      <li data-msg="howChrome"></li>
    </ul>
  </section>

  <footer><a data-href="repo" target="_blank" data-msg="optSource"></a></footer>
</main>
<script src="common.js"></script>
<script src="welcome.js"></script>
</body>
</html>
