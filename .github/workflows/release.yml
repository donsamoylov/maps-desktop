# Сборка Maps Desktop. Push в main — проверочная сборка. Тег v1.2.3 — релиз: подписанное приложение,
# архив и его подпись для встроенного обновления.
name: Build and release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Import signing certificate
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CERT_P12: ${{ secrets.MAPSDESKTOP_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.MAPSDESKTOP_CERT_PASSWORD }}
        run: |
          KC="$RUNNER_TEMP/signing.keychain-db"
          KC_PASS=$(openssl rand -hex 16)
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KC_PASS" "$KC"
          security set-keychain-settings -lut 3600 "$KC"
          security unlock-keychain -p "$KC_PASS" "$KC"
          security import "$RUNNER_TEMP/cert.p12" -k "$KC" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KC_PASS" "$KC"
          security list-keychains -d user -s "$KC" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"

      - name: Build
        env:
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ github.run_number }}
          SIGN_ID: ${{ startsWith(github.ref, 'refs/tags/v') && 'Maps Desktop Developer' || '-' }}
        run: ./build.sh --zip

      - name: Pack Chrome extension
        run: tools/pack_extension.sh

      - name: Sign update archive
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          MAPSDESKTOP_UPDATE_KEY: ${{ secrets.MAPSDESKTOP_UPDATE_KEY }}
        run: swift tools/update_key.swift sign build/MapsDesktop.zip > build/MapsDesktop.zip.sig

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: MapsDesktop-${{ steps.version.outputs.version }}
          path: |
            build/MapsDesktop.zip
            build/maps-desktop-chrome-extension.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" build/MapsDesktop.zip build/MapsDesktop.zip.sig build/maps-desktop-chrome-extension.zip \
            --title "Maps Desktop ${{ steps.version.outputs.version }}" --generate-notes
